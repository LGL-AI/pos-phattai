name: CI / Deploy

# Every push: full test suite.
# Other branches: compile the Android app (unsigned) to prove the Java builds.
# main: build + sign the APK when the app changed, publish it as a GitHub Release,
#       back up D1, apply migrations, deploy the Worker with the APK on the update channel.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  FORCE_COLOR: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Release gate (asset sync, catalog, full test suite)
        run: npm run release:gate
      - name: Android staff assets must be committed in sync with public/staff
        run: git diff --exit-code -- android/app/src/main/assets/staff

  android-compile:
    if: github.ref != 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Android SDK 35
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" > /dev/null
      - name: Compile unsigned APK (proof only, never published)
        working-directory: android
        env:
          LOTUS_UNSIGNED_BUILD: '1'
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund

      - name: Check required secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          CT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$CT" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CA" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      - name: Android SDK 35
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1" > /dev/null

      - name: Reuse the published APK if the app did not change
        id: plan
        run: |
          inputs=$(node scripts/android-inputs-hash.mjs)
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          latest=$(gh release list --limit 50 --json tagName --jq '[.[] | select(.tagName | startswith("android-v"))][0].tagName // ""')
          if [ -n "$latest" ] && gh release view "$latest" --json body --jq .body | grep -q "inputs:$inputs"; then
            code=${latest#android-v}
            name=$(gh release view "$latest" --json body --jq .body | sed -n 's/.*version:\([0-9.]*\).*/\1/p' | head -1)
            mkdir -p dist && gh release download "$latest" --pattern '*.apk' --dir dist
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Reusing $latest ($name) - APK inputs unchanged ($inputs)"
          else
            code=$((1000 + GITHUB_RUN_NUMBER))
            name="1.7.${GITHUB_RUN_NUMBER}"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building new APK $name ($code) for inputs $inputs"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "LOTUS_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "LOTUS_VERSION_NAME=$name" >> "$GITHUB_ENV"

      - name: Build and sign APK
        if: steps.plan.outputs.build == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LOTUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LOTUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export LOTUS_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$LOTUS_KEYSTORE"
          ./gradlew --no-daemon --stacktrace assembleRelease
          rm -f "$LOTUS_KEYSTORE"
          mkdir -p ../dist && cp app/build/outputs/apk/release/*.apk "../dist/LotusPOS_PhatTai_${LOTUS_VERSION_NAME}.apk"

      - name: Put the APK on the in-app update channel
        run: |
          apk=$(ls dist/*.apk | head -1)
          node scripts/publish-android-release.mjs "$apk" \
            --notes-vi "$(git log -1 --format=%s | cut -c1-300)" \
            --notes-zh "错误修复与改进"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release (keeps every signed APK)
        if: steps.plan.outputs.build == 'true'
        run: |
          gh release create "android-v${LOTUS_VERSION_CODE}" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "APK ${LOTUS_VERSION_NAME}" \
            --notes "version:${LOTUS_VERSION_NAME} code:${LOTUS_VERSION_CODE} inputs:${{ steps.plan.outputs.inputs }} commit:${GITHUB_SHA}"

      - name: Back up D1, migrate, deploy Worker, verify production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-remote.mjs

      - name: Keep the D1 backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_number }}
          path: backups/*.sql
          if-no-files-found: ignore
          retention-days: 90
