<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Lotus POS · Offline / 离线</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#17202a;font:16px system-ui;padding:24px;box-sizing:border-box}.card{max-width:460px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 12px 36px rgba(15,23,42,.12);text-align:center}.logo{width:72px;height:72px;border-radius:18px;object-fit:cover}h1{font-size:22px}.cn{display:block;color:#64748b;margin-top:6px}button{border:0;border-radius:12px;background:#2563eb;color:#fff;padding:13px 18px;font-weight:800;font-size:16px}</style>
</head>
<body><main class="card"><img class="logo" src="echo-coffee-logo.jpg" alt="Echo Coffee"><h1>Đang ngoại tuyến<span class="cn">当前离线</span></h1><p>Không thể gửi đơn hoặc tạo yêu cầu thanh toán khi chưa kết nối. Hãy kết nối mạng rồi thử lại.</p><p class="cn">未连接网络时无法提交订单或创建支付请求，请联网后重试。</p><button onclick="location.reload()">Thử lại / 重试</button></main></body>
</html>
